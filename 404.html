<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Moonmang 문망</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#0B1C24;--teal:#10B0A8;--teal-600:#0C8F89;--muted:#5D717A;--line:#E1E8EB;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",system-ui,sans-serif;
}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px;font-family:var(--font);background:#fff;color:var(--ink);
  letter-spacing:-0.015em;word-break:keep-all;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;text-align:left}
.logo{height:26px;width:auto;margin-bottom:44px}
.code{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-600)}
h1{margin:16px 0 0;font-size:clamp(28px,5vw,40px);line-height:1.15;font-weight:800;letter-spacing:-0.04em}
p{margin:18px 0 0;font-size:15px;line-height:1.85;color:var(--muted)}
.links{margin-top:36px;display:flex;gap:12px;flex-wrap:wrap}
a.btn{
  display:inline-block;padding:13px 24px;border-radius:2px;font-size:14.5px;font-weight:600;
  text-decoration:none;transition:background .2s ease,color .2s ease;
}
.solid{background:var(--ink);color:#fff}
.solid:hover{background:#12323F}
.ghost{border:1px solid var(--line);color:var(--ink)}
.ghost:hover{background:#F4F7F8}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/images/logo.png" alt="Moonmang">
    <p class="code">Error 404</p>
    <h1>This page does not exist.</h1>
    <p>
      The address may have changed, or it may have been mistyped. Everything on
      this site lives on one page — the link below will take you there.
      <br><br>
      주소가 바뀌었거나 잘못 입력되었을 수 있습니다. 아래 링크로 이동해 주세요.
    </p>
    <div class="links">
      <a class="btn solid" href="/">Go to the homepage</a>
      <a class="btn ghost" href="/#contact">Contact us</a>
    </div>
  </div>
</body>
</html>
